<!-- Calendar Widget Component -->
<div class="calendar-widget-wrapper">
  <div class="panel-header">
    <div class="panel-title">
      <i class="fa-regular fa-calendar-check"></i>
      Lịch Sinh nhật CBNV
    </div>
    <div class="filter-controls">
      <select class="filter-select" id="departmentFilter">
        <option value="">-- Tất cả Đơn vị / Phòng ban --</option>
        {% for dept in departments %}
        <option value="{{ dept.id }}">{{ dept.name }}</option>
        {% endfor %}
      </select>

      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="searchStaff" placeholder="Tìm tên CBNV...">
      </div>
    </div>
  </div>

  <div class="calendar-toolbar">
    <div class="calendar-nav">
      <button type="button" class="cal-btn" id="prevMonthBtn" title="Tháng trước" aria-label="Tháng trước"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="cal-current-label" id="currentMonthLabel">Tháng {{ current_month }} - {{ current_year }}</span>
      <button type="button" class="cal-btn" id="nextMonthBtn" title="Tháng sau" aria-label="Tháng sau"><i class="fa-solid fa-chevron-right"></i></button>
      <button type="button" class="btn-today" id="btnGoToday"><i class="fa-regular fa-clock"></i> Hôm nay</button>
    </div>
  </div>

  <div class="calendar-grid" id="calendarGrid">
    <div class="cal-header-day">Th 2</div>
    <div class="cal-header-day">Th 3</div>
    <div class="cal-header-day">Th 4</div>
    <div class="cal-header-day">Th 5</div>
    <div class="cal-header-day">Th 6</div>
    <div class="cal-header-day">Th 7</div>
    <div class="cal-header-day" style="color: var(--birthday-coral);">CN</div>
    <!-- Dynamically rendered days or Django for loop -->
  </div>

  <div class="selected-day-details">
    <div class="sub-section-title" style="display: flex; justify-content: space-between; align-items: center;">
      <span>
        <i class="fa-solid fa-user-group" style="color: var(--primary); margin-right: 6px;"></i>
        Danh sách CBNV sinh nhật ngày <strong id="selectedDateLabel">Hôm nay</strong>
      </span>
      <span id="staffCountLabel" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;"></span>
    </div>

    <div style="overflow-x: auto;">
      <table class="cbnv-table">
        <thead>
          <tr>
            <th scope="col">Cán bộ nhân viên</th>
            <th scope="col">Ngày sinh (Ẩn năm)</th>
            <th scope="col">Đơn vị / Phòng ban</th>
            <th scope="col">Trạng thái Email</th>
            <th scope="col" style="text-align: right;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="cbnvTableBody">
          <tr>
            <td colspan="5" style="text-align: center; padding: 20px; color: var(--text-muted);">
              <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Đang tải dữ liệu sinh nhật CBNV...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
