<!-- Calendar Widget Component -->
<div class="calendar-widget-wrapper">
  <div class="panel-header">
    <div class="panel-title">
      <i class="fa-regular fa-calendar-check"></i>
      Lịch Sinh nhật CBNV
    </div>
    <div class="filter-controls">
      <select class="filter-select" id="departmentFilter">
        <option value="">-- Tất cả Đơn vị / Phòng ban --</option>
        {% for dept in departments %}
        <option value="{{ dept.id }}">{{ dept.name }}</option>
        {% endfor %}
      </select>

      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="searchStaff" placeholder="Tìm tên CBNV...">
      </div>
    </div>
  </div>

  <div class="calendar-toolbar">
    <div class="calendar-nav">
      <button class="cal-btn" id="prevMonthBtn"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="cal-current-label" id="currentMonthLabel">Tháng {{ current_month }} - {{ current_year }}</span>
      <button class="cal-btn" id="nextMonthBtn"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="btn-today" id="btnGoToday"><i class="fa-regular fa-clock"></i> Hôm nay</button>
    </div>
  </div>

  <div class="calendar-grid" id="calendarGrid">
    <div class="cal-header-day">Th 2</div>
    <div class="cal-header-day">Th 3</div>
    <div class="cal-header-day">Th 4</div>
    <div class="cal-header-day">Th 5</div>
    <div class="cal-header-day">Th 6</div>
    <div class="cal-header-day">Th 7</div>
    <div class="cal-header-day" style="color: var(--birthday-coral);">CN</div>
    <!-- Dynamically rendered days or Django for loop -->
  </div>

  <div class="selected-day-details">
    <div class="sub-section-title">
      <span>
        <i class="fa-solid fa-user-group" style="color: var(--primary); margin-right: 6px;"></i>
        Danh sách CBNV sinh nhật ngày <strong id="selectedDateLabel">Hôm nay</strong>
      </span>
    </div>

    <div style="overflow-x: auto;">
      <table class="cbnv-table">
        <thead>
          <tr>
            <th>Cán bộ nhân viên</th>
            <th>Ngày sinh (Ẩn năm)</th>
            <th>Đơn vị / Phòng ban</th>
            <th>Trạng thái Email</th>
            <th style="text-align: right;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="cbnvTableBody">
          <!-- Populated by Django or fetch API -->
        </tbody>
      </table>
    </div>
  </div>
</div>
