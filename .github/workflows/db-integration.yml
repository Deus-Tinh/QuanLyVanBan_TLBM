name: DB Integration

# Kiểm tra migration và schema trên PostgreSQL trống.
# - pull-request: chạy trên kết quả merge của PR vào nhánh đích.
# - all-branches: gộp thử mọi nhánh nhóm (1_* … 8_*) vào staging để phát hiện
#   xung đột giữa các nhóm (migration, tên bảng, phụ thuộc chéo app).

on:
  pull_request:
    branches:
      - main
      - staging
      - '[1-8]_*'
  push:
    branches:
      - staging
  schedule:
    - cron: '0 20 * * *'  # 03:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DJANGO_SETTINGS_MODULE: config.settings_ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: '5432'
  POSTGRES_DB: tlbm_ci
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

jobs:
  migrate-postgres:
    name: migrate-postgres
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tlbm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt "psycopg[binary]>=3.2,<4"

      - name: Django system check (gồm trùng db_table giữa các model)
        run: python manage.py check

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate trên PostgreSQL trống
        run: python manage.py migrate --noinput

      - name: Kiểm tra không còn migration chưa áp dụng
        run: python manage.py migrate --noinput --check

      - name: Django tests trên PostgreSQL
        run: python manage.py test

  all-branches:
    name: all-branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tlbm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Gộp thử mọi nhánh nhóm vào staging
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          failed=""
          for b in $(git branch -r | sed 's/^ *//' | grep -E '^origin/[1-8]_'); do
            if git merge --no-edit --no-ff "$b"; then
              echo "merged $b"
            else
              echo "::error::Xung đột khi gộp $b vào staging"
              git merge --abort
              failed="$failed $b"
            fi
          done
          echo "MERGE_FAILED=$failed" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt "psycopg[binary]>=3.2,<4"

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Missing migrations check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate trên PostgreSQL trống
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Django tests trên PostgreSQL
        working-directory: backend
        run: python manage.py test

      - name: Báo lỗi nếu có nhánh không gộp được
        if: always()
        run: |
          if [ -n "$MERGE_FAILED" ]; then
            echo "Các nhánh xung đột với staging:$MERGE_FAILED"
            exit 1
          fi
